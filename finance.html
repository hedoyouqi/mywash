<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>주식 & 금융 대시보드</title>

    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --up-color: #ef4444;
            --down-color: #3b82f6;
            --ball-y: #fbc531; --ball-b: #0984e3; --ball-r: #e84118; --ball-g: #7f8fa6; --ball-gn: #4cd137;
        }

        body.light {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.06);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent: #0284c7;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; outline: none; }

        body {
            margin: 0; background-color: var(--bg-color);
            color: var(--text-main); font-family: 'Noto Sans KR', sans-serif;
            min-height: 100vh; transition: background-color 0.3s ease, color 0.3s ease;
            padding: 20px 16px 60px;
        }

        .rajdhani { font-family: 'Rajdhani', sans-serif; }
        .container { max-width: 540px; margin: auto; }

        /* 상단 바 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .ip { font-size: 0.82rem; color: var(--text-sub); font-weight: 600; background: var(--card-bg); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--card-border); backdrop-filter: blur(10px); }
        .controls { display: flex; gap: 8px; }
        .icon-btn { background: var(--card-bg); border: 1px solid var(--card-border); width: 40px; height: 40px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-main); box-shadow: var(--shadow); transition: transform 0.2s; }
        .icon-btn:active { transform: scale(0.9); }

        /* 카드 공통 스타일 */
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; padding: 20px; margin-bottom: 18px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: var(--shadow); position: relative; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .card-title { font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        
        .card-tools { display: flex; align-items: center; gap: 8px; }
        .update-time { font-size: 0.7rem; color: var(--text-sub); font-family: 'Rajdhani', sans-serif; }
        .refresh-btn { background: transparent; border: 1px solid var(--card-border); color: var(--text-sub); width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; transition: all 0.2s; }
        .refresh-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: rotate(180deg); }

        /* 시계 위젯 */
        .time-section { text-align: center; padding: 16px; }
        .date-badge { display: inline-block; font-size: 0.8rem; color: var(--accent); background: rgba(56, 189, 248, 0.1); padding: 4px 12px; border-radius: 12px; margin-bottom: 6px; font-weight: 700; }
        .time-display { font-size: 3rem; font-weight: 700; line-height: 1; letter-spacing: -1px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* 시장 심리 배너 */
        .market-mood { display: flex; align-items: center; gap: 14px; background: rgba(56, 189, 248, 0.05); border: 1px solid rgba(56, 189, 248, 0.15); border-radius: 16px; padding: 14px 18px; margin-bottom: 18px; }
        .mood-icon { font-size: 2rem; }
        .mood-info .title { font-size: 0.9rem; font-weight: 700; color: var(--accent); }
        .mood-info .desc { font-size: 0.78rem; color: var(--text-sub); margin-top: 2px; line-height: 1.3; }

        /* 지수 그리드 */
        .indices-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .index-item { background: rgba(255,255,255,0.02); border: 1px solid var(--card-border); padding: 14px; border-radius: 14px; display: flex; flex-direction: column; gap: 4px; }
        .index-name { font-size: 0.75rem; color: var(--text-sub); }
        .index-val { font-size: 1.15rem; font-weight: 700; }
        .index-change { font-size: 0.75rem; font-weight: 700; }
        .up { color: var(--up-color); }
        .down { color: var(--down-color); }

        /* 로또 번호 스타일 (맨 하단) */
        .lotto-wrap { display: flex; flex-direction: column; gap: 8px; }
        .lotto-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid rgba(255,255,255,0.04); }
        .lotto-ball { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.3); box-shadow: inset -2px -2px 5px rgba(0,0,0,0.3); font-family: 'Rajdhani', sans-serif; }

        @media(min-width: 600px) { .container { max-width: 640px; } }
    </style>
</head>

<body class="dark">
<div class="container">
    <!-- 상단 바 -->
    <div class="top-bar">
        <div class="ip" id="ip">IP 확인중...</div>
        <div class="controls">
            <button class="icon-btn" id="modeBtn" onclick="toggleMode()" title="테마 변경">☀️</button>
            <button class="icon-btn" onclick="refreshAll()" title="전체 새로고침">🔄</button>
        </div>
    </div>

    <!-- 실시간 시계 -->
    <div class="card time-section" style="margin-bottom: 14px;">
        <div class="date-badge" id="date">로딩 중...</div>
        <div class="time-display rajdhani" id="time">00:00:00</div>
    </div>

    <!-- 시장 심리 배너 -->
    <div class="market-mood" id="marketMoodBox">
        <div class="mood-icon" id="moodIcon">⏳</div>
        <div class="mood-info">
            <div class="title" id="moodTitle">시장 데이터 로딩 중...</div>
            <div class="desc" id="moodDesc">실시간 금융 지수를 불러오는 중입니다.</div>
        </div>
    </div>

    <!-- 주요 지수 및 실시간 환율 카드 -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">📊 글로벌 주요 지수 & 실시간 환율</div>
            <div class="card-tools">
                <span class="update-time" id="update-indices">--:--:--</span>
                <button class="refresh-btn" onclick="updateIndices()" title="새로고침">↻</button>
            </div>
        </div>
        <div class="indices-grid">
            <div class="index-item">
                <span class="index-name">코스피 (KOSPI)</span>
                <span class="index-val rajdhani" id="kospi-val">불러오는 중...</span>
                <span class="index-change" id="kospi-change">-</span>
            </div>
            <div class="index-item">
                <span class="index-name">코스닥 (KOSDAQ)</span>
                <span class="index-val rajdhani" id="kosdaq-val">불러오는 중...</span>
                <span class="index-change" id="kosdaq-change">-</span>
            </div>
            <div class="index-item">
                <span class="index-name">나스닥 (NASDAQ)</span>
                <span class="index-val rajdhani" id="nasdaq-val">불러오는 중...</span>
                <span class="index-change" id="nasdaq-change">-</span>
            </div>
            <div class="index-item">
                <span class="index-name">원/달러 환율</span>
                <span class="index-val rajdhani" id="exchange-val">불러오는 중...</span>
                <span class="index-change up" id="exchange-status">Live</span>
            </div>
        </div>
    </div>

    <!-- 나만의 행운 번호 (로또 추천) -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">🍀 이번 주 나만의 행운 번호</div>
            <div class="card-tools">
                <span class="update-time" id="update-lotto">일요일 06시 갱신</span>
                <button class="refresh-btn" onclick="renderLotto()" title="새로고침">↻</button>
            </div>
        </div>
        <div class="lotto-wrap" id="lotto"></div>
    </div>
</div>

<script>
    /* --- 테마 모드 전환 --- */
    function toggleMode(){
        document.body.classList.toggle('dark');
        document.body.classList.toggle('light');
        const isDark = document.body.classList.contains('dark');
        document.getElementById('modeBtn').innerText = isDark ? '☀️' : '🌙';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    
    if(localStorage.getItem('theme') === 'light') {
        document.body.classList.remove('dark');
        document.body.classList.add('light');
        document.getElementById('modeBtn').innerText = '🌙';
    } else {
        document.body.classList.add('dark');
        document.getElementById('modeBtn').innerText = '☀️';
    }

    document.addEventListener('contextmenu', e => e.preventDefault());

    /* --- IP 가져오기 --- */
    fetch('https://api.ipify.org?format=json')
        .then(r => r.json())
        .then(d => document.getElementById('ip').innerText = d.ip)
        .catch(() => document.getElementById('ip').innerText = 'IP 숨김');

    /* --- 실시간 시간 갱신 --- */
    function updateTime(){
        try {
            const now = new Date();
            const dateStr = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'long' }).format(now);
            const timeStr = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(now);
            document.getElementById('date').innerText = dateStr;
            document.getElementById('time').innerText = timeStr;
        } catch(e) { console.error(e); }
    }
    setInterval(updateTime, 1000);
    updateTime();

    function getTimeString() {
        const now = new Date();
        return now.toTimeString().split(' ')[0];
    }

    /* --- 진짜 지수 및 환율 가져오기 --- */
    async function updateIndices() {
        let isKospiUp = false, isNasdaqUp = false;

        // 1. 실시간 원/달러 환율 API
        try {
            const res = await fetch('https://open.er-api.com/v6/latest/USD');
            const data = await res.json();
            if (data && data.rates && data.rates.KRW) {
                const krw = data.rates.KRW.toLocaleString('ko-KR', {maximumFractionDigits: 2});
                document.getElementById('exchange-val').innerText = krw + '원';
            }
        } catch(e) {
            document.getElementById('exchange-val').innerText = '1,375.00원';
        }

        // 2. 외부 지수 데이터 받아오기
        const fetchIndex = async (symbol, valElemId, changeElemId) => {
            try {
                const proxyUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d`;
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(proxyUrl)}`);
                const jsonWrapper = await res.json();
                const data = JSON.parse(jsonWrapper.contents);
                
                const meta = data.chart.result[0].meta;
                const price = meta.regularMarketPrice.toLocaleString('ko-KR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                const prevClose = meta.chartPreviousClose || meta.previousClose;
                const diff = meta.regularMarketPrice - prevClose;
                const rate = ((diff / prevClose) * 100).toFixed(2);
                const isUp = diff >= 0;

                const valElem = document.getElementById(valElemId);
                const changeElem = document.getElementById(changeElemId);
                valElem.innerText = price;
                changeElem.innerText = `${isUp ? '+' : ''}${rate}%`;
                changeElem.className = `index-change ${isUp ? 'up' : 'down'}`;

                return isUp;
            } catch(e) {
                return false;
            }
        };

        isKospiUp = await fetchIndex('^KS11', 'kospi-val', 'kospi-change');
        await fetchIndex('^KQ11', 'kosdaq-val', 'kosdaq-change');
        isNasdaqUp = await fetchIndex('^IXIC', 'nasdaq-val', 'nasdaq-change');

        // 시장 심리 배너 업데이트
        const moodIcon = document.getElementById('moodIcon');
        const moodTitle = document.getElementById('moodTitle');
        const moodDesc = document.getElementById('moodDesc');

        if (isKospiUp && isNasdaqUp) {
            moodIcon.innerText = "🔥";
            moodTitle.innerText = "현재 시장: 강한 불장 (Bull Market)";
            moodDesc.innerText = "글로벌 주요 지수가 동반 상승 중입니다.";
        } else if (!isKospiUp && !isNasdaqUp) {
            moodIcon.innerText = "💧";
            moodTitle.innerText = "현재 시장: 조정장 / 약세장 (Bear Market)";
            moodDesc.innerText = "지수 하락으로 리스크 관리가 필요합니다.";
        } else {
            moodIcon.innerText = "⚖️";
            moodTitle.innerText = "현재 시장: 혼조세 / 박스권 장세";
            moodDesc.innerText = "국장과 미장의 디커플링이 진행되고 있습니다.";
        }

        document.getElementById('update-indices').innerText = getTimeString();
    }

    /* --- 사용자별 & 일요일 오전 6시 기준 로또 추천 --- */
    function getBallColor(num) {
        if (num <= 10) return 'var(--ball-y)';
        if (num <= 20) return 'var(--ball-b)';
        if (num <= 30) return 'var(--ball-r)';
        if (num <= 40) return 'var(--ball-g)';
        return 'var(--ball-gn)';
    }

    function getLottoWeekKey() {
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const kstDate = new Date(utc + (9 * 3600000));
        
        const day = kstDate.getDay();
        const hour = kstDate.getHours();
        
        if (day === 0 && hour < 6) {
            kstDate.setDate(kstDate.getDate() - 1);
        }
        
        const sun = new Date(kstDate);
        sun.setDate(sun.getDate() - sun.getDay());
        sun.setHours(6, 0, 0, 0);
        
        if (kstDate < sun) {
            sun.setDate(sun.getDate() - 7);
        }
        
        return sun.toISOString().split('T')[0];
    }

    function getOrCreateUserGuid() {
        let guid = localStorage.getItem('user_guid');
        if (!guid) {
            guid = 'u-' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
            localStorage.setItem('user_guid', guid);
        }
        return guid;
    }

    function seededRandom(seed) {
        let x = Math.sin(seed++) * 10000;
        return x - Math.floor(x);
    }

    function renderLotto() {
        const container = document.getElementById('lotto');
        if (!container) return;
        container.innerHTML = '';

        const weekKey = getLottoWeekKey();
        const guid = getOrCreateUserGuid();
        
        let combined = weekKey + guid;
        let seed = 0;
        for (let i = 0; i < combined.length; i++) {
            seed = (seed << 5) - seed + combined.charCodeAt(i);
            seed |= 0;
        }
        seed = Math.abs(seed);

        for (let i = 0; i < 5; i++) {
            let nums = [];
            while (nums.length < 6) {
                let n = Math.floor(seededRandom(seed++) * 45) + 1;
                if (!nums.includes(n)) nums.push(n);
            }
            nums.sort((a, b) => a - b);

            const row = document.createElement('div');
            row.className = 'lotto-row';
            nums.forEach(n => {
                const ball = document.createElement('div');
                ball.className = 'lotto-ball';
                ball.innerText = n;
                ball.style.backgroundColor = getBallColor(n);
                row.appendChild(ball);
            });
            container.appendChild(row);
        }
        document.getElementById('update-lotto').innerText = getTimeString();
    }

    /* --- 전체 새로고침 --- */
    function refreshAll() {
        updateIndices();
        renderLotto();
    }

    // 초기 실행
    refreshAll();
</script>
</body>
</html>
